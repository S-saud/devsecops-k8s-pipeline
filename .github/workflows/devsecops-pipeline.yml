name: Zero-Trust DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Hadolint (Dockerfile Security Linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

      - name: Build Docker Image
        run: |
          docker build -t devsecops-app:latest ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-app:latest'
          format: 'json'
          output: 'trivy-results.json'

      - name: Execute Python Security Gate
        run: |
          python scripts/security_check.py

      - name: Install Cosign & Sign Container
        uses: sigstore/cosign-installer@v3.5.0

      - name: Generate Key Pair and Sign Image (Simulated)
        run: |
          echo "Image successfully scanned, verified, and signed with Cosign."