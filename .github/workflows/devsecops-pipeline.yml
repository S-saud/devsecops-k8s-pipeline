name: Zero-Trust DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Run Hadolint (Dockerfile Security Linter)
        run: |
          docker run --rm -i hadolint/hadolint hadolint --ignore DL3006 - < app/Dockerfile || true

      - name: Setup Minikube K8s Cluster
        uses: medyagh/setup-minikube@master

      - name: Build Docker Image directly into Minikube
        run: |
          eval $(minikube -p minikube docker-env)
          docker build -t devsecops-app:latest ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-app:latest'
          format: 'json'
          output: 'trivy-results.json'

      - name: Execute Python Security Gate
        run: |
          python scripts/security_check.py

      - name: Deploy to Kubernetes Cluster & Verify Health
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/devsecops-app --timeout=90s