name: Zero-Trust DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Run Hadolint (Dockerfile Security Linter)
        run: |
          docker run --rm -i hadolint/hadolint hadolint --ignore DL3006 - < app/Dockerfile || true

      - name: Build Docker Image Locally
        run: |
          docker build -t devsecops-app:latest ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-app:latest'
          format: 'json'
          output: 'trivy-results.json'

      - name: Execute Python Security Gate
        run: |
          python scripts/security_check.py

      - name: Setup Minikube K8s Cluster
        uses: medyagh/setup-minikube@master

      - name: Load Image into Minikube
        run: |
          minikube image load devsecops-app:latest

      - name: Deploy to Kubernetes Cluster & Verify Health
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/devsecops-app --timeout=120s

      - name: Notify Slack on Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'good'
          SLACK_TITLE: 'Pipeline Passed Successfully!'
          SLACK_MESSAGE: 'DevSecOps Pipeline and Kubernetes Deployment run successful.'

      - name: Notify Slack on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'danger'
          SLACK_TITLE: 'Pipeline Failed!'
          SLACK_MESSAGE: 'Security check or Kubernetes deployment failed. Please check logs.'